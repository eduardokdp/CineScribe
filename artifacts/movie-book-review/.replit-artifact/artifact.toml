kind = "web"
previewPath = "/"
title = "Movie & Book Review"
version = "1.0.0"
id = "artifacts/movie-book-review"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21844

[services.development]
run = "pnpm --filter @workspace/movie-book-review run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/movie-book-review", "run", "build" ]
publicDir = "artifacts/movie-book-review/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21844"
BASE_PATH = "/"
